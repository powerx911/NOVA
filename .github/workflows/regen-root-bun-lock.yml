name: Regenerate root Bun lockfile

on:
  push:
    branches:
      - fix/nova-account-deletion-20261120
    paths:
      - package.json
      - bun.lock
      - .github/workflows/regen-root-bun-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Regenerate lockfile from package.json
        run: bun install --ignore-scripts

      - name: Commit regenerated lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: regenerate root Bun lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
