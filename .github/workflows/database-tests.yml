name: NOVA isolated database tests

on:
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "supabase/ci/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/database-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/ci/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/database-tests.yml"

permissions:
  contents: read

concurrency:
  group: nova-db-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-postgres:
    name: PostgreSQL 17 + pgTAP (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # The repository's historical migration chain is incomplete. Start a
      # disposable empty Supabase DB first, then restore the CI-only snapshot
      # and apply only the migrations under test.
      - name: Start disposable database without replaying historical migrations
        shell: bash
        run: |
          set -euo pipefail
          migrations_dir="supabase/migrations"
          parked_dir="supabase/.ci-migrations-parked"
          test -d "$migrations_dir"
          test ! -e "$parked_dir"
          mv "$migrations_dir" "$parked_dir"
          mkdir -p "$migrations_dir"
          restore_migrations() {
            rmdir "$migrations_dir" 2>/dev/null || true
            if [ -d "$parked_dir" ]; then
              mv "$parked_dir" "$migrations_dir"
            fi
          }
          trap restore_migrations EXIT
          supabase start --exclude rest,auth,realtime,storage,functions,studio,mail,analytics,pooler

      - name: Restore data-free NOVA schema snapshot
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/ci/nexora_schema_snapshot.sql

      - name: Apply only the PR migrations to the isolated database
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          for migration in \
            supabase/migrations/20261119120000_nova_economy_abuse_guards.sql \
            supabase/migrations/20261119130000_nova_recurring_mission_periods.sql \
            supabase/migrations/20261119140000_nova_market_wallet_lock_order.sql
          do
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Execute database regression suites
        run: supabase test db

      - name: Stop disposable database
        if: always()
        run: supabase stop
