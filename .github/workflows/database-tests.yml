name: NOVA isolated database tests

on:
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "supabase/ci/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/validate_migration_manifest.py"
      - ".github/workflows/ci.yml"
      - "playwright.config.mjs"
      - "e2e/**"
      - ".github/workflows/database-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/ci/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/validate_migration_manifest.py"
      - ".github/workflows/database-tests.yml"

permissions:
  contents: read

concurrency:
  group: nova-db-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-postgres:
    name: PostgreSQL 17 + pgTAP (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production migration source manifest
        run: python scripts/validate_migration_manifest.py

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      # The repository's historical migration chain is incomplete. Start a
      # disposable empty Supabase DB first, then restore the CI-only snapshot
      # and apply only the migrations under test.
      - name: Start disposable database without replaying historical migrations
        shell: bash
        run: |
          set -euo pipefail
          migrations_dir="supabase/migrations"
          parked_dir="supabase/.ci-migrations-parked"
          test -d "$migrations_dir"
          test ! -e "$parked_dir"
          mv "$migrations_dir" "$parked_dir"
          mkdir -p "$migrations_dir"
          restore_migrations() {
            rmdir "$migrations_dir" 2>/dev/null || true
            if [ -d "$parked_dir" ]; then
              mv "$parked_dir" "$migrations_dir"
            fi
          }
          trap restore_migrations EXIT
          supabase start --exclude edge-runtime,gotrue,imgproxy,kong,logflare,mailpit,postgres-meta,postgrest,realtime,storage-api,studio,supavisor,vector

      - name: Restore data-free NOVA schema snapshot
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/ci/nexora_schema_snapshot.sql

      - name: Apply only the PR migrations to the isolated database
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          for migration in \
            supabase/migrations/20261119112257_nova_economy_abuse_guards.sql \
            supabase/migrations/20261119112311_nova_recurring_mission_periods.sql \
            supabase/migrations/20261119112320_nova_market_wallet_lock_order.sql \
            supabase/migrations/20261119140000_nova_tiered_medal_rewards.sql \
            supabase/migrations/20261119141305_20261119160000_nova_dynamic_contracts_org_goals.sql \
            supabase/migrations/20261119141731_20261119142000_nova_org_goal_contribution_org_index.sql \
            supabase/migrations/20261119143000_nova_weekly_market_mogul.sql \
            supabase/migrations/20261119150000_nova_mission_achievement_rebuild.sql \
            supabase/migrations/20261119160154_nova_contract_slot_cooldowns.sql \
            supabase/migrations/20261119160205_nova_contract_slot_refresh_limits.sql \
            supabase/migrations/20261119160209_nova_ten_org_weekly_goals.sql \
            supabase/migrations/20261119160214_nova_independent_contract_claim_limits.sql \
            supabase/migrations/20261119164015_nova_manufacturing_queue_inventory_capacity.sql \
            supabase/migrations/20261119171452_nova_market_price_bounds_manufacturing_cancel.sql \
            supabase/migrations/20261119210000_nova_factory_automatic_operations_progression.sql \
            supabase/migrations/20261119211000_nova_factory_progression_curve_calibration.sql \
            supabase/migrations/20261119212000_nova_factory_operating_margin_calibration.sql \
            supabase/migrations/20261120000000_nova_factory_resource_specific_growth_curves.sql \
            supabase/migrations/20261120043000_nova_market_contract_manufacturing_notifications.sql \
            supabase/migrations/20261120132839_nova_production_company_parity_hotfix_20261120.sql \
            supabase/migrations/20261120133000_nova_full_economy_rebalance.sql \
            supabase/migrations/20261120150000_nova_reward_notifications_organization_chat.sql \
            supabase/migrations/20261120160000_nova_factory_support_all_raw_resources.sql \
            supabase/migrations/20261120170000_nova_company_factory_audit_guards.sql \
            supabase/migrations/20261120220000_nova_company_economy_rebalance_v2.sql \
            supabase/migrations/20261120230000_nova_company_upgrade_duration_rebalance.sql \
            supabase/migrations/20261120231000_nova_company_upgrade_cost_rebalance.sql \
            supabase/migrations/20261120232000_nova_company_upgrade_anchor_rebalance.sql \
            supabase/migrations/20261120233000_nova_company_upgrade_charge_reconciliation.sql \
            supabase/migrations/20261120135718_nova_production_economy_parity_repair.sql \
            supabase/migrations/20261120235000_nova_company_founding_parity_repair.sql \
            supabase/migrations/20261120235500_nova_factory_operating_wallet_reserve.sql \
            supabase/migrations/20261120235600_nova_company_server_collectable_quote.sql \
            supabase/migrations/20261120235700_nova_remove_hidden_quantum_server_recipe.sql \
            supabase/migrations/20261121000000_nova_treasury_withdrawal_lock_and_auction_refund.sql \
            supabase/migrations/20261121001000_nova_unified_account_deletion.sql \
            supabase/migrations/20261121002000_nova_factory_contract_upgrade_guard_fixes.sql \
            supabase/migrations/20261121004000_nova_biotech_recipe_integrity_fix.sql \
            supabase/migrations/20261121005000_nova_company_revenue_minimum_rewards.sql \
            supabase/migrations/20261121006000_nova_manufacturing_rls_auction_fk_indexes.sql \
            supabase/migrations/20261121081031_market_listing_limits.sql \
            supabase/migrations/20261121081916_nexora_merchant_daily_sales.sql \
            supabase/migrations/20261121082006_nexora_merchant_bio_module_price.sql \
            supabase/migrations/20261121100000_nexora_daily_sale_quantity_limit.sql \
            supabase/migrations/20261121110000_nova_org_contract_claim_serialization.sql \
            supabase/migrations/20261121111500_nova_org_contract_claim_conflict_error.sql \
            supabase/migrations/20261121113000_nova_company_revenue_reward_abuse_fix.sql \
            supabase/migrations/20261121114000_nova_factory_upgrade_double_charge_guard.sql \
            supabase/migrations/20261120184839_nova_financial_idempotency_market_history.sql \
            supabase/migrations/20261120191611_nova_live_player_skill_effects.sql \
            supabase/migrations/20261120192229_nova_org_contract_negotiation_bonus.sql \
            supabase/migrations/20261121123000_nova_nexora_sale_idempotency.sql \
            supabase/migrations/20261122124652_create_admin_accounts.sql \
            supabase/migrations/20261122134726_grant_admin_player_report_access.sql \
            supabase/migrations/20261122143000_create_player_feedback.sql \
            supabase/migrations/20261122160000_nova_support_tickets_and_player_reports.sql \
            supabase/migrations/20261122161000_nova_unify_player_feedback_statuses.sql \
            supabase/migrations/20261122170000_nova_admin_display_names_and_feedback_status_default.sql \
            supabase/migrations/20261122180000_nova_reports_tickets_service_role_access.sql
          do
            if [ "$migration" = "supabase/migrations/20261120135718_nova_production_economy_parity_repair.sql" ]; then
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/ci/replay_patches/prepare_factory_upgrade_parity.sql
            fi
            if [ "$migration" = "supabase/migrations/20261120235000_nova_company_founding_parity_repair.sql" ]; then
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/ci/replay_patches/prepare_company_founding_parity.sql
            fi
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Execute database regression suites
        run: supabase test db

      - name: Verify complete production schema snapshot
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS nexora CASCADE;'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/ci/nexora_production_schema_snapshot.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/ci/verify_production_schema_snapshot.sql

      - name: Stop disposable database
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop
          else
            echo 'Supabase CLI was not installed; no local stack was started.'
          fi
