name: NEXORA Firestore Export

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "scan reads source only; import writes idempotent batches to nexora"
        required: true
        default: scan
        type: choice
        options:
          - scan
          - import

permissions:
  contents: read
  id-token: write

concurrency:
  group: nexora-firestore-export
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'luffyk124-del/nexora-game' && (github.ref == 'refs/heads/feature/nexora-social-economy-mobile-overhaul' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate Google Cloud federation configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_GITHUB_WIF_PROVIDER }}
        run: |
          if [ -z "$WIF_PROVIDER" ]; then
            echo "::error::Set the repository variable GCP_GITHUB_WIF_PROVIDER after creating the GitHub OIDC Workload Identity provider in Google Cloud."
            exit 1
          fi

      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_GITHUB_WIF_PROVIDER }}
          service_account: nexora-vercel-runtime@gen-lang-client-0074900177.iam.gserviceaccount.com
          project_id: gen-lang-client-0074900177
          token_format: access_token

      - name: Export Firestore and optionally import into Supabase
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          EXPORT_MODE: ${{ inputs.mode || 'scan' }}
        run: node scripts/nexora-firestore-export.mjs
