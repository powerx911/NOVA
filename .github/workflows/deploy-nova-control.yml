name: Deploy NOVA Control MCP

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/nova-control/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-nova-control.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-control-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.117.0

      - name: Configure function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NOVA_GITHUB_TOKEN: ${{ secrets.NOVA_GITHUB_TOKEN }}
          NOVA_MCP_ACCESS_TOKEN: ${{ secrets.NOVA_MCP_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$NOVA_GITHUB_TOKEN"
          test -n "$NOVA_MCP_ACCESS_TOKEN"
          supabase secrets set \
            "NOVA_GITHUB_TOKEN=$NOVA_GITHUB_TOKEN" \
            "NOVA_MCP_ACCESS_TOKEN=$NOVA_MCP_ACCESS_TOKEN" \
            --project-ref hmrprnjhyzyefocdmnxf

      - name: Deploy NOVA Control MCP
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy nova-control \
            --project-ref hmrprnjhyzyefocdmnxf \
            --no-verify-jwt
