name: NOVA Prototype Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Verify new game experience entry points
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -Fq 'href="./styles.css"' index.html
          grep -Fq 'src="./app.js"' index.html
          grep -Fq 'id="view-home"' index.html
          grep -Fq 'id="view-empire"' index.html
          grep -Fq 'id="view-world"' index.html
          grep -Fq 'id="view-market"' index.html
          grep -Fq 'id="view-conflict"' index.html
          grep -Fq 'id="view-social"' index.html
          grep -Fq 'id="simulate-battle"' index.html
          grep -Fq 'id="business-list"' index.html
          grep -Fq 'data-view="world"' index.html

      - name: Validate server-authoritative player migration contract
        run: node scripts/check-player-migration.mjs

      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD
