name: NOVA Prototype Checks

on:
  push:
    branches: [feat/new-world-game-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Validate current map-free mobile UI
        run: node scripts/validate-ui.mjs

      - name: Validate original server-authoritative player foundation
        run: node scripts/check-player-migration.mjs

      - name: Validate competitive backend security contract
        run: node scripts/check-competitive-migration.mjs

      - name: Validate shared player market security contract
        run: node scripts/check-market-migration.mjs

      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD
