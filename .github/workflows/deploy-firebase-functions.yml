name: Deploy Firebase Auth Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-firebase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-firebase-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firebase Auth deletion endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Firebase deployment credential is configured
        env:
          FIREBASE_SERVICE_ACCOUNT_NOVA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NOVA }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_NOVA" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT_NOVA repository secret before deploying Firebase Functions."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NOVA }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Deploy Firebase Auth deletion function
        run: npx --yes firebase-tools@14.22.0 deploy --only functions:deleteFirebasePlayerAuth --project gen-lang-client-0074900177 --non-interactive
