name: NOVA CI

on:
  push:
    branches:
      - main
      - "development/**"
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, rules, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate PostgreSQL migration and pgTAP SQL syntax
        run: |
          python -m pip install --disable-pip-version-check pglast
          python scripts/validate_supabase_sql.py

      - name: Validate unique Supabase migration versions
        run: python scripts/validate_unique_migration_versions.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Lint Firestore rules
        run: npm run lint:rules

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Typecheck Supabase migration importer
        run: deno check supabase/functions/nexora-migration-import/index.ts

      - name: "Typecheck NOVA Supabase API (legacy function name: nexora-api)"
        run: deno check supabase/functions/nexora-api/index.ts

      - name: Test Firebase recent-auth deletion policy
        run: deno test supabase/functions/nexora-api/_shared/auth_policy.deno.ts

      - name: Typecheck retired NOVA control endpoint
        run: deno check supabase/functions/nova-control/index.ts

      - name: Unit tests
        run: npm test

      - name: Simulate 10,000 dynamic contract offers
        run: npm run test:contract-economy

      - name: Build web application
        run: npm run build

      - name: Verify GitHub Pages base path build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Build Cloud Functions
        run: npm run build --prefix functions
