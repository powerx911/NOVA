name: NOVA CI

on:
  push:
    branches:
      - main
      - "development/**"
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, rules, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate PostgreSQL migration and pgTAP SQL syntax
        run: |
          python -m pip install --disable-pip-version-check pglast
          python scripts/validate_supabase_sql.py

      - name: Validate unique Supabase migration versions
        run: python scripts/validate_unique_migration_versions.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Lint Firestore rules
        run: npm run lint:rules

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: "Typecheck NOVA Supabase API (legacy function name: nexora-api)"
        run: deno check supabase/functions/nexora-api/index.ts

      - name: Typecheck Admin Center Edge Function
        run: deno check supabase/functions/admin-center/index.ts

      - name: Test Firebase recent-auth deletion policy
        run: deno test supabase/functions/nexora-api/_shared/auth_policy.deno.ts

      - name: Typecheck retired NOVA control endpoint
        run: deno check supabase/functions/nova-control/index.ts

      - name: Unit tests
        run: npm test

      - name: Simulate 10,000 dynamic contract offers
        run: npm run test:contract-economy

      - name: Build web application
        run: npm run build

      - name: Verify GitHub Pages base path build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Build Cloud Functions
        run: npm run build --prefix functions

  e2e:
    name: Playwright isolated smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    # E2E remains opt-in and disabled until explicitly requested by the project owner.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.NOVA_E2E_ENABLED == 'true' }}
    env:
      NOVA_E2E_BASE_URL: ${{ secrets.NOVA_E2E_BASE_URL }}
      NOVA_E2E_EMAIL: ${{ secrets.NOVA_E2E_EMAIL }}
      NOVA_E2E_PASSWORD: ${{ secrets.NOVA_E2E_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Verify Playwright discovers the smoke spec
        run: npx playwright test --list

      - name: Install Chromium for isolated E2E
        if: ${{ env.NOVA_E2E_BASE_URL != '' && env.NOVA_E2E_EMAIL != '' && env.NOVA_E2E_PASSWORD != '' }}
        run: npx playwright install --with-deps chromium

      - name: Run isolated Playwright smoke test
        if: ${{ env.NOVA_E2E_BASE_URL != '' && env.NOVA_E2E_EMAIL != '' && env.NOVA_E2E_PASSWORD != '' }}
        run: npm run test:e2e

      - name: Report isolated E2E skipped
        if: ${{ env.NOVA_E2E_BASE_URL == '' || env.NOVA_E2E_EMAIL == '' || env.NOVA_E2E_PASSWORD == '' }}
        run: echo "Skipping browser mutations because NOVA_E2E_BASE_URL, NOVA_E2E_EMAIL, and NOVA_E2E_PASSWORD are not all configured."
