name: NOVA CI

on:
  push:
    branches:
      - main
      - "development/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, security rules, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json

      - name: Install root dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Lint Firestore rules
        run: npm run lint:rules

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Typecheck Supabase migration importer
        run: deno check supabase/functions/nexora-migration-import/index.ts

      - name: Typecheck NOVA Supabase API (legacy function name: nexora-api)
        run: deno check supabase/functions/nexora-api/index.ts

      - name: Typecheck retired NOVA control endpoint
        run: deno check supabase/functions/nova-control/index.ts

      - name: Unit tests
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Verify GitHub Pages base path build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Build Cloud Functions
        run: npm run build --prefix functions


  e2e-smoke:
    name: Playwright onboarding, market and company smoke test
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Run E2E when an isolated test environment is configured
        env:
          NOVA_E2E_BASE_URL: ${{ secrets.NOVA_E2E_BASE_URL }}
          NOVA_E2E_EMAIL: ${{ secrets.NOVA_E2E_EMAIL }}
          NOVA_E2E_PASSWORD: ${{ secrets.NOVA_E2E_PASSWORD }}
        run: |
          if [ -z "$NOVA_E2E_BASE_URL" ] || [ -z "$NOVA_E2E_EMAIL" ] || [ -z "$NOVA_E2E_PASSWORD" ]; then
            echo "::notice::Playwright smoke test skipped: configure NOVA_E2E_BASE_URL, NOVA_E2E_EMAIL and NOVA_E2E_PASSWORD for an isolated test environment."
            exit 0
          fi
          npx playwright install --with-deps chromium
          npm run test:e2e
