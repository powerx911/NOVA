name: Deploy NEXORA Firestore Rules

on:
  push:
    branches:
      - development/nexora-next
      - main
    paths:
      - firestore.rules
      - firebase.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-firestore-rules-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy NEXORA Firestore rules
    if: github.ref == 'refs/heads/development/nexora-next' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch that triggered this deployment
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0074900177
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXORA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy only NEXORA Firestore rules
        run: firebase deploy --only firestore:rules --project gen-lang-client-0074900177 --non-interactive
