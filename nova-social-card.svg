<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">NOVA — ابنِ إمبراطوريتك</title>
<desc id="desc">ابدأ من الصفر. ابنِ شركاتك. سيطر على السوق. عالمك يبدأ من هنا.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090D18"/><stop offset=".58" stop-color="#151B2A"/><stop offset="1" stop-color="#270F20"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#E04455" stop-opacity=".38"/><stop offset="1" stop-color="#E04455" stop-opacity="0"/></radialGradient>
  <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF7A86"/><stop offset="1" stop-color="#B91C32"/></linearGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#FFFFFF" stroke-opacity=".055" stroke-width="1"/></pattern>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect width="1200" height="630" fill="url(#grid)"/>
<circle cx="890" cy="315" r="330" fill="url(#glow)"/>
<circle cx="890" cy="315" r="190" fill="none" stroke="#E04455" stroke-opacity=".18" stroke-width="1.5"/>
<circle cx="890" cy="315" r="145" fill="none" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="1.5" stroke-dasharray="5 12"/>
<g transform="translate(765 185)">
  <rect x="0" y="0" width="250" height="250" rx="58" fill="#101522" stroke="#FFFFFF" stroke-opacity=".13" stroke-width="2"/>
  <path d="M45 184V66h32l96 83V66h32v118h-31L77 99v85Z" fill="url(#mark)"/>
  <path d="M45 184L173 66" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="5"/>
</g>
<g fill="#FFFFFF">
  <text x="690" y="120" text-anchor="end" font-family="Arial,sans-serif" font-size="22" letter-spacing="7" fill="#F18A96">YOUR WORLD. YOUR EMPIRE.</text>
  <text x="690" y="270" text-anchor="end" font-family="Arial,sans-serif" font-size="100" font-weight="800" letter-spacing="3">NOVA</text>
  <text x="690" y="340" text-anchor="end" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#F3DCE0">ابنِ إمبراطوريتك</text>
  <text x="690" y="395" text-anchor="end" font-family="Arial,sans-serif" font-size="24" fill="#B9C0CE">ابدأ من الصفر. ابنِ شركاتك. سيطر على السوق.</text>
</g>
<path d="M90 520H1110" stroke="#FFFFFF" stroke-opacity=".16"/>
<text x="90" y="565" font-family="Arial,sans-serif" font-size="19" letter-spacing="2" fill="#9BA5B7">A LIVING WORLD OF STRATEGY &amp; AMBITION</text>
<text x="1110" y="565" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#E87583">POWERED BY NOVA</text>
</svg>